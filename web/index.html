<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>⚡ Autocomplete Search</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --accent: #5b8cff;
    --text: #e7e9ee;
    --muted: #8b93a7;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 640px;
    margin: 60px auto;
    padding: 0 20px;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 28px; }
  .search-box { position: relative; }
  input {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  .suggestions {
    margin-top: 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--panel);
  }
  .suggestion {
    padding: 12px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
  }
  .suggestion:last-child { border-bottom: none; }
  .suggestion:hover { background: #1f2430; }
  .suggestion .rank { color: var(--muted); font-size: 12px; }
  .meta {
    margin-top: 14px;
    color: var(--muted);
    font-size: 13px;
    display: flex;
    gap: 16px;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    background: #1f2937;
    color: var(--accent);
    font-weight: 600;
  }
  .stats {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
  }
  .empty { color: var(--muted); padding: 14px 16px; font-size: 14px; }
</style>
</head>
<body>
  <h1>⚡ Autocomplete Search</h1>
  <p class="sub">Trie-backed prefix search — try "amaz", "goog", "app"</p>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Start typing..." autocomplete="off" />
    <div id="suggestions" class="suggestions" style="display:none;"></div>
  </div>

  <div class="meta">
    <span id="responseTime"></span>
    <span id="cacheBadge"></span>
  </div>

  <div class="stats" id="statsBar">Loading stats…</div>

  <script>
    const input = document.getElementById('searchInput');
    const suggestionsDiv = document.getElementById('suggestions');
    const responseTimeEl = document.getElementById('responseTime');
    const cacheBadgeEl = document.getElementById('cacheBadge');
    const statsBar = document.getElementById('statsBar');

    let debounceTimer = null;

    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        statsBar.innerHTML =
          `${data.words_loaded.toLocaleString()} words loaded · ` +
          `startup ${data.load_time_ms}ms · ` +
          `cache ${data.cache_enabled ? 'on' : 'off'}`;
      } catch (e) {
        statsBar.textContent = 'Could not reach /api/stats';
      }
    }

    async function fetchSuggestions(query) {
      const res = await fetch(`/api/autocomplete?q=${encodeURIComponent(query)}`);
      return res.json();
    }

    function render(data) {
      if (!data.suggestions.length) {
        suggestionsDiv.innerHTML = `<div class="empty">No matches</div>`;
        suggestionsDiv.style.display = 'block';
      } else {
        suggestionsDiv.innerHTML = data.suggestions
          .map((s, i) => `<div class="suggestion" data-word="${s}">
              <span>${s}</span><span class="rank">#${i + 1}</span>
            </div>`)
          .join('');
        suggestionsDiv.style.display = 'block';
      }
      responseTimeEl.innerHTML = `<span class="badge">${data.response_time_ms.toFixed(2)}ms</span>`;
      cacheBadgeEl.textContent = data.cached ? '(served from cache)' : '';
    }

    input.addEventListener('input', (e) => {
      const query = e.target.value.trim();
      clearTimeout(debounceTimer);

      if (!query) {
        suggestionsDiv.style.display = 'none';
        responseTimeEl.textContent = '';
        cacheBadgeEl.textContent = '';
        return;
      }

      debounceTimer = setTimeout(async () => {
        const data = await fetchSuggestions(query);
        render(data);
      }, 80); // small debounce so we don't fire a request per keystroke
    });

    suggestionsDiv.addEventListener('click', (e) => {
      const target = e.target.closest('.suggestion');
      if (target) {
        input.value = target.dataset.word;
        suggestionsDiv.style.display = 'none';
      }
    });

    loadStats();
  </script>
</body>
</html>
